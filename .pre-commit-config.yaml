repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect committed secrets (API keys, tokens)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: update-file-tree
        name: Regenerate docs/FILE_TREE.txt and AST outline
        entry: ./scripts/run_hooks.sh
        language: system
        pass_filenames: false


# Setup (one-time):
#   pip install pre-commit --break-system-packages
#   pre-commit install
#
# After that, every `git commit` runs these checks automatically.
# If gitleaks flags a false positive (e.g. an example/dummy key), add the
# fingerprint to .gitleaksignore rather than disabling the hook.
