# Per-agent LLM provider routing.
# provider options: anthropic | openai | ollama | mlx | opencode
# Route cheap/high-volume tasks locally, reserve cloud for quality-sensitive tasks.
#
# NOTE (2026-08-05, Step 1 parity debugging): ollama-provider base_urls
# intentionally have NO /v1 suffix. LLMClient's Ollama backend
# (OllamaNativeClient in llm.py) hits native /api/chat, not the OpenAI-
# compatible /v1/chat/completions shim -- an isolated timing test found
# the compat shim consistently slower at the same `think` setting (see
# docs/handoffs/2026-08-05-n8n-python-parity-debugging.md). mlx_smoke_test
# below keeps its /v1 suffix on purpose: oMLX has no native /api/chat
# equivalent, it's OpenAI-compatible only.

scout_summarizer:
  provider: ollama
  model: qwen2.5:14b
  base_url: http://localhost:11434

# Used by the 8 native selection branches (summary/headings/bullets/skills;
# intro/story/impact/gratitude) and the cover-letter stitch pass. Matches the
# n8n reference implementation's model exactly (gemma4:12b-mlx via Ollama on
# :11434) for parity-checking during the port. Revisit once parity is
# confirmed — nothing says this has to stay the model long-term.
writer_selection:
  provider: ollama
  model: gemma4:12b-mlx
  base_url: http://localhost:11434
  # num_ctx intentionally NOT set here as of 2026-08-07. It was set to
  # 8192 earlier this session as a hedge against Ollama's conservative
  # default context window, but a real run against this exact model
  # (confirmed via `ollama ps`: 262144 context, no num_ctx override
  # applied) produced clean output -- meaning gemma4:12b-mlx's own
  # native/Modelfile default is already generous, and an explicit
  # smaller value here would risk overriding it DOWNWARD rather than
  # protecting against a too-small default, undoing exactly what it was
  # meant to prevent. LLMClient/OllamaNativeClient still support num_ctx
  # as role-level config (see llm.py) -- only add a value here again if
  # this role gets pointed at a different model whose own default proves
  # too small, sized to what THAT model actually needs, not a guess.

writer_coverletter:
  provider: ollama
  model: gemma4:12b-mlx
  base_url: http://localhost:11434

# Critic's blind-review pass (ADR-0006 Phase 2 item #1). Routed to
# Anthropic on the same reasoning as writer_coverletter and
# networker_email_draft: quality-sensitive, low-volume, worth the cloud
# cost. Change freely if you'd rather run this locally.
critic_review:
  provider: ollama
  model: gemma4:12b-mlx
  base_url: http://localhost:11434

# Scorer's job-fit triage pass (pre-Writer -- see scorer.py's own docstring
# for what this does and doesn't judge). Was gemma3:1b-it-qat (a "get it
# working" fast-model pick, never load-tested for format compliance) until
# 2026-08-10, when a real --debug run showed exactly why that mattered: the
# model's entire response was the literal 9 characters "SCORE: 6\n" -- no
# paragraph, no rationale, not even the dash separator critic.py's
# parse_score() requires. Not a truncation or parsing bug -- the model
# simply didn't attempt the instructed two-part format at all. Switched to
# gemma4:12b-mlx: this project's own quality-tier model (writer_selection/
# writer_coverletter/critic_review), already proven in this exact codebase
# to follow structured-output instructions reliably (see the 2026-08-07
# writer_selection debugging handoff). Slower per call -- multi-second on
# local hardware -- accepted deliberately over qwen2.5:14b's untested-on-
# this-format speed, since scorer_fit's whole job is producing a judgment
# call in a specific parseable shape; a fast wrong-shaped answer is worse
# than a slow right-shaped one here. Revisit if this proves too slow at
# real triage volume (hundreds of postings per run).
scorer_fit:
  provider: ollama
  model: gemma4:12b-mlx
  base_url: http://localhost:11434

networker_contact_research:
  provider: ollama
  model: qwen2.5:14b
  base_url: http://localhost:11434

networker_email_draft:
  provider: ollama
  model: gemma4:12b-mlx
  base_url: http://localhost:11434

analyst_weekly_report:
  provider: ollama
  model: qwen2.5:14b
  base_url: http://localhost:11434

# Temporary — Step 0 verification only, not wired into anything real yet.
# oMLX requires an API key on its OpenAI-compatible endpoint (Ollama doesn't).
# Set it via: export OMLX_API_KEY=<key from the oMLX app>
# Model name is the "Active now" name from oMLX's Status panel — confirm
# against the actual /v1/models response once auth is working, since the
# loaded-model display name isn't guaranteed to match the API's model id.
mlx_smoke_test:
  provider: mlx
  model: gemma-4-12b-coder-fable5-composer2.5-4bit
  base_url: http://127.0.0.1:8000/v1
  api_key: ${OMLX_API_KEY}

# MLX example (Apple Silicon native inference), if preferred over Ollama for a role:
# scout_summarizer:
#   provider: mlx
#   model: mlx-community/Qwen2.5-14B-Instruct-4bit

# OpenCode example, if used as a coding/dev-assistant role rather than a data role:
# dev_assistant:
#   provider: opencode
#   model: <model-name-per-opencode-config>
