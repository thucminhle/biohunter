<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BioHunter Capture — Options</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 16px; max-width: 400px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; }
    button { margin-top: 10px; padding: 6px 14px; cursor: pointer; }
    #saved { color: #1e5a3c; font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>
  <h2>BioHunter Capture — Settings</h2>
  <label>Dashboard base URL (include http:// and port)</label>
  <input id="baseUrl" type="text" placeholder="http://localhost:5050" />
  <button id="saveBtn">Save</button>
  <span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
