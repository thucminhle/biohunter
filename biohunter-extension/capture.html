<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BioHunter Capture</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, sans-serif;
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px 0;
    }
    label {
      display: block;
      font-size: 11px;
      color: #555;
      margin-top: 8px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 12px;
      padding: 4px;
      margin-top: 2px;
    }
    textarea {
      height: 80px;
      resize: vertical;
    }
    #captureBtn {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
    }
    #status.error { color: #b00020; }
    #status.ok { color: #1e5a3c; }
    #status a { color: #1e5a3c; }
    #source-note {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>BioHunter Capture</h1>
  <div id="source-note">Loading...</div>

  <label>Company</label>
  <input id="company" type="text" />

  <label>Title</label>
  <input id="title" type="text" />

  <label>Location (optional)</label>
  <input id="location" type="text" />

  <label>URL</label>
  <input id="url" type="text" />

  <label>Direct application link (optional, recommended)</label>
  <input id="applyUrl" type="text" placeholder="Where you'd actually click to apply — often not the LinkedIn URL" />

  <label>Description</label>
  <textarea id="description"></textarea>

  <button id="captureBtn">Capture to BioHunter</button>
  <div id="status"></div>

  <script src="capture.js"></script>
</body>
</html>
